<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
</head>
<body>
    <h2>The available food options are:</h2>
    {% for food in foods %}
        <h3>{{ food.name }}</h3>
        <p>{{ food.description }}</p>
        <p>Price: {{ food.price }}</p>
    {% endfor %}
</body>
</html>
